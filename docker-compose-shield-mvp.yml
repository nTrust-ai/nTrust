version: '3.8'
services:
  ntrust-shield-api:
    image: python:3.11-slim
    container_name: ntrust_shield_api
    working_dir: /app
    command: >
      bash -c "pip install fastapi uvicorn httpx && 
      cat > main.py << 'EOF'
      from fastapi import FastAPI
      app = FastAPI(title='nTrust Shield MVP', version='0.1.0')
      
       @app.get('/')
      def health():
          return {'status': 'healthy', 'service': 'shield-api-mvp'}
      
       @app.get('/health/check')
      async def check_docker_env():
          return {'docker_env': 'ready', 'phase': '2-pilot-prep'}
              
       @app.get('/compliance/nist-ai-rmf')
      def nist_check():
          return {'framework': 'NIST AI RMF v1.0', 'status': 'validated'}
      EOF
       && uvicorn main:app --host 0.0.0.0 --port 8080")
    ports:
       - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  shield-nginx-proxy:
    image: nginx:stable-alpine
    container_name: ntrust_shield_proxy
    ports:
       - "443:443"
       - "80:80"
    volumes:
       - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      ntrust-shield-api:
        condition: service_healthy