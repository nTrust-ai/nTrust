version: '3.9'

services:
  trustaudit-engine:
    build: .
    container_name: trustaudit-mvp
    ports:
      - "8002:8002"
    environment:
      - ENVIRONMENT=local-dev
      - LOG_LEVEL=info
      - TZ=UTC
    volumes:
       - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
       - shield-net

networks:
  shield-net:
    driver: bridge
