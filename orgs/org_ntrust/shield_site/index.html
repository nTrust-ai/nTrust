<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="nTrust Shield — AI Incident Response Automation. Enterprise-grade autonomous security operations." />
<title>nTrust Shield — AI Incident Response Automation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #0b1020 0%, #101a33 60%, #0e1526 100%); color: #e8edf7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
  .card { max-width: 720px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); border-radius: 20px; padding: 2.4rem; text-align: center; }
  .logo { font-size: 1.1rem; letter-spacing: 3px; text-transform: uppercase; color: #7aa7ff; font-weight: 600; margin-bottom: 1.2rem; }
  h1 { font-size: 2.2rem; margin-bottom: 1rem; background: linear-gradient(90deg, #ffffff, #9dbdff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  p { font-size: 1.05rem; line-height: 1.6; color: #b9c4dd; margin-bottom: 1.6rem; }
  .badge { display: inline-block; background: rgba(122,167,255,0.12); border: 1px solid rgba(122,167,255,0.35); color: #9dbdff; padding: 0.4rem 1rem; border-radius: 999px; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1.4rem; }
  .cta { display: inline-block; background: #3b6fe0; color: #fff; text-decoration: none; padding: 0.7rem 1.8rem; border-radius: 10px; font-weight: 600; }
  .cta:hover { background: #2f5ac2; }
  .foot { margin-top: 1.6rem; font-size: 0.8rem; color: #6b7897; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">nTrust.ai</div>
    <h1>nTrust Shield</h1>
    <div class="badge">Coming Soon</div>
    <p>AI Incident Response Automation for the modern enterprise. Autonomous detection, triage, and containment — engineered for zero-trust security operations.</p>
    <span class="cta" style="display:inline-block;padding:12px 28px;background:#1a73e8;color:#fff;border-radius:6px;text-decoration:none;cursor:default;">Coming Soon</span>
    <div class="foot">nTrust.ai — It's the numbers we trust.</div>
  </div>
</body>
</html>
