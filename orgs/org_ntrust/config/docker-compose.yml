version: '3.8'
services:
  shield-api:
    build: ../shield-api
    ports:
      - "8080:8080"
    env_file: ../config/.env
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../certs/:/etc/nginx/certs/
