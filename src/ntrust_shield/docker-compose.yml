version: "3.8"

services:
  ntrust-shield-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ntrust-shield-stack
    ports:
       - "8080:8080"
    environment:
       - PYTHONUNBUFFERED=1
       - ENVIRONMENT=local-mvp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
       - shield-network
    volumes:
       - ./logs:/app/logs

networks:
  shield-network:
    driver: bridge
