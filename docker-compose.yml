version: '3.8'

services:
  ntrust-web:
    build: .
    ports:
      - "8085:8085"
      - "443:443"
    environment:
      - NODE_ENV=production
      - API_URL=https://api.ntrust.ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - spine-net

networks:
  spine-net:
    driver: bridge
