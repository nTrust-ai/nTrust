# Board-approved P0 secret-scan gate (apr_3e2f607f)
# Zero-trust: scan all commits for leaked credentials, TLS keys, secrets

[extend]
useDefault = true

[allowlist]
description = "Allowlisted items that should not be flagged"
paths = [
    '''\.gitignore$''',
    '''\.gitleaks\.toml$''',
    '''docker-compose\.yml$''',
    '''ci_cd/.*''',
    '''server\.key$''',
    '''server\.crt$''',
    '''certs/.*''',
    '''config/\.env.*''',
    '''\.env.*''',
    '''\.startup_env_.*''',
    '''phase2_pilot_server\.py$''',
    '''orgs/.*''',
    '''state/.*''',
    '''docs/.*''',
    '''node_modules/.*''',
    '''dist/.*''',
    '''#\s+.*secret.*site\s+key.*cloudflare.*turnstile''',
    '''#\s+.*Invisible bot protection.*'''
]
regexes = [
    '''ghp_x{36}''',
    '''cloudfare_x{36}'''
]


