<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nTrust.ai - Enterprise Cybersecurity Solutions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: white; padding: 2rem; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 3rem; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .subtitle { font-size: 1.2rem; opacity: 0.9; margin-bottom: 2rem; }
        .features { display: grid; gap: 1rem; text-align: left; margin-top: 2rem; }
        .feature { background: rgba(255,255,255,0.15); padding: 1rem; border-radius: 10px; backdrop-filter: blur(5px); }
        .cta-button { display: inline-block; margin-top: 2rem; padding: 1rem 2rem; background: white; color: #667eea; text-decoration: none; font-weight: bold; border-radius: 50px; transition: all 0.3s ease; }
        .cta-button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255,255,255,0.5); }
    </style>
</head>
<body>
    <div class="container">
        <h1>nTrust.ai 🛡️</h1>
        <p class="subtitle">Enterprise-Grade Cybersecurity & AI Security Strategy Solutions</p>
        
        <div class="features">
            <div class="feature">🔐 Risk Assessment & Compliance Frameworks (NIST, EU AI Act)</div>
            <div class="feature">🤖 Automated Threat Detection Systems</div>
            <div class="feature">📊 Real-time Security Monitoring Dashboards</div>
        </div>

        <a href="#" class="cta-button" id="contactBtn">Schedule a Consultation →</a>
    </div>

    <script>
        document.getElementById('contactBtn').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Thank you for your interest in nTrust.ai! Our security team will contact you shortly.');
        });
    </script>
</body>
</html>
