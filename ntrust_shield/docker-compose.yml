version: '3.8'

services:
  ntrust-shield-api:
    build: .
    container_name: ntrust-shield-mvp
    restart: unless-stopped
    ports:
       - "8000:8000"
    volumes:
       - ./logs:/app/logs
    environment:
       - PYTHONUNBUFFERED=1
       - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
       - shield_net

networks:
  shield_net:
    driver: bridge
