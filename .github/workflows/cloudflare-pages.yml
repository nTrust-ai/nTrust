name: Deploy to Cloudflare Pages

# ROOT-CAUSE FIX (2026-10-04, Atlas / Infrastructure & DevOps)
# ----------------------------------------------------------------------------
# Prior state: BOTH "Deploy to Cloudflare Pages" workflows invoked the
# third-party action `cloudflare/pages-action@v1`. Under the org Actions policy
# GitHub reports: "Unable to resolve actions. Cannot access repositories
# 'cloudflare/pages-action'". The deploy job therefore died at 'Set up job',
# so the Cloudflare Pages bundle was never refreshed and durable routes
# (/naveed 302 -> LinkedIn, /trustguard/ + health.json) returned 404 while the
# stale apex stayed up.
#
# Fix: deploy with the official `wrangler` CLI driven through `npx` (a plain
# run-step; NO third-party action required). Uses the existing repository
# secrets CF_PAGES_TOKEN (API token) and CF_ACCOUNT_ID (account id).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CF_PROJECT_NAME: 'ntrust-ai'

jobs:
  deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (vite -> dist/)
        run: npm run build
        env:
          CI: true

      - name: Assert durable surfaces exist in artifact
        run: |
          set -euo pipefail
          test -f dist/index.html             || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/_redirects             || { echo "::error::dist/_redirects missing (/naveed 302)"; exit 1; }
          test -f dist/trustguard/index.html  || { echo "::error::dist/trustguard/index.html missing"; exit 1; }
          test -f dist/trustguard/health.json || { echo "::error::dist/trustguard/health.json missing"; exit 1; }
          grep -q "linkedin.com/in/naveedulislam" dist/_redirects || { echo "::error::/naveed redirect absent"; exit 1; }
          echo "Artifact assertions PASS"

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ]  || { echo "::error::CF_PAGES_TOKEN secret is not set"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::CF_ACCOUNT_ID secret is not set"; exit 1; }
          echo "Cloudflare credentials present."

      - name: Deploy to Cloudflare Pages (wrangler direct upload)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy dist \
            --project-name="${CF_PROJECT_NAME}" \
            --branch=main \
            --commit-dirty=true
