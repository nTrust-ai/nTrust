name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
       - uses: actions/checkout@v4
       
       - name: Setup Node.js
         uses: actions/setup-node@v4
         with:
           node-version: '20'
           cache: 'npm'
       
       - name: Install dependencies
         run: npm ci
       
       - name: Run linting
         run: npm run lint --if-present
       
       - name: Build
         run: npm run build
         env:
           CI: true
       
       - name: Upload dist artifact
         uses: actions/upload-artifact@v4
         with:
           name: cloudflare-pages-dist
           path: dist/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks scan gate
        run: |
          echo "::group::Install gitleaks"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_x64-linux.tar.gz | tar xz
          mv gitleaks /usr/local/bin/gitleaks
          echo "::endgroup::"
          echo "::group::Run scan"
          /usr/local/bin/gitleaks detect --source . -v --config .gitleaks.toml
          echo "✅ Secret scan PASSED. No critical credentials detected."
          echo "::endgroup::"

  deploy:
    needs: [build-and-test, secret-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
       - uses: actions/checkout@v4
       
       - name: Download dist artifact
         uses: actions/download-artifact@v4
         with:
           name: cloudflare-pages-dist
           path: dist/
       
       - name: Deploy to Cloudflare Pages
         if: env.CF_PAGES_API_TOKEN != '' || env.CF_PAGES_TOKEN != ''
         uses: cloudflare/pages-action@v1
         with:
           apiToken: ${{ secrets.CF_PAGES_API_TOKEN || secrets.CF_PAGES_TOKEN }}
           accountId: ${{ secrets.CF_ACCOUNT_ID }}
           projectName: ntrust-ai
           directory: dist
